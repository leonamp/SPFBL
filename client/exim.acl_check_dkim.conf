# SPFBL Irondome - DKIM ACL for pure Exim (Debian/Ubuntu).
# Loaded by "acl_smtp_dkim = /etc/exim4/spfbl/acl_check_dkim.conf".
# Collects the domains whose DKIM signature was validated, separated by commas.
  warn
    dkim_status = pass
    condition = ${if eq {$dkim_domain}{$dkim_cur_signer}{true}{false}}
    set acl_c_dkim_domain_set = ${if def:acl_c_dkim_domain_set {$acl_c_dkim_domain_set,$dkim_domain}{$dkim_domain}}
  accept
