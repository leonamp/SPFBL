######################################################################
# SPFBL Irondome gateway: Exim on port 25 in front of Postfix.
#
# Inbound mail is checked by the SPFBL ACLs and delivered to Postfix on
# 127.0.0.1:GW_INBOUND_PORT, a service without relay. Mail from this host
# goes to Postfix on 127.0.0.1:GW_LOCAL_PORT, with the original port 25
# settings. Values of this host are in /opt/spfbl/exim/etc/local.conf.
######################################################################

.include /opt/spfbl/exim/etc/local.conf

primary_hostname = GW_HOSTNAME
daemon_smtp_ports = 25
exim_user = spfbl-exim
exim_group = spfbl-exim
never_users = root
keep_environment =

# Every domain accepted by Postfix: the recipient is checked by callout.
domainlist local_domains = *
hostlist relay_from_hosts = <; 127.0.0.1 ; ::1

acl_smtp_rcpt = acl_check_rcpt
acl_smtp_dkim = acl_check_dkim
acl_smtp_data = acl_check_data

message_size_limit = GW_SIZE_LIMIT
av_scanner = GW_AV_SCANNER

.ifdef GW_TLS_CERT
tls_advertise_hosts = *
tls_certificate = GW_TLS_CERT
tls_privatekey = GW_TLS_KEY
.else
tls_advertise_hosts =
.endif

host_lookup = *
rfc1413_hosts =
smtp_accept_max = 250
smtp_accept_queue_per_connection = 0
ignore_bounce_errors_after = 2d
# Frozen messages wait for "spfbl holding".
timeout_frozen_after = 7d
log_selector = +smtp_protocol_error +smtp_syntax_error +tls_peerdn
check_spool_space = 100M

######################################################################
begin acl
######################################################################

acl_check_rcpt:
  # Local command line submissions.
  accept
    hosts = :
  # Mail from this host keeps the original Postfix path.
  accept
    hosts = +relay_from_hosts
  deny
    message = Restricted characters in address
    local_parts = ^[.] : ^.*[@%!/|] : ^.*/\\.\\./
  require
    message = nice hosts say HELO first
    condition = ${if def:sender_helo_name}
  # Postfix decides: unknown recipient or relay is rejected, Postfix down defers.
  # No cache: a mailbox created or removed in the panel counts at once.
  require
    verify = recipient/callout=30s,no_cache
.ifndef SPFBL_TEST
.include /opt/spfbl/exim/etc/acl_check_rcpt.conf
.endif
  accept

acl_check_dkim:
.include /opt/spfbl/exim/etc/acl_check_dkim.conf

acl_check_data:
  deny
    message = maximum allowed line length is 998 octets, got $max_received_linelength
    condition = ${if > {$max_received_linelength}{998}}
.ifndef SPFBL_TEST
.include /opt/spfbl/exim/etc/acl_check_data.conf
.endif
  accept

######################################################################
begin routers
######################################################################

# Mail from this host and the bounces generated by Exim.
postfix_local:
  driver = manualroute
  condition = ${if or {{!def:sender_host_address}{match_ip {$sender_host_address}{+relay_from_hosts}}}}
  route_list = * 127.0.0.1
  transport = postfix_local
  self = send
  no_more

# Inbound mail, also used by the recipient callout.
postfix_inbound:
  driver = manualroute
  route_list = * 127.0.0.1
  transport = postfix_inbound
  self = send
  no_more

######################################################################
begin transports
######################################################################

postfix_inbound:
  driver = smtp
  port = GW_INBOUND_PORT
  allow_localhost
  hosts_avoid_tls = *
  hosts_try_chunking =
  hosts_try_prdr =

postfix_local:
  driver = smtp
  port = GW_LOCAL_PORT
  allow_localhost
  hosts_avoid_tls = *
  hosts_try_chunking =
  hosts_try_prdr =

######################################################################
begin retry
######################################################################

*   *   F,2h,5m; G,16h,1h,1.5; F,4d,6h

######################################################################
begin rewrite
######################################################################
